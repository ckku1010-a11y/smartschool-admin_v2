<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchool Admin - 教師代課面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-8">

  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    <!-- 頂部導航列 -->
    <div class="bg-slate-900 text-white p-5 md:p-6 flex justify-between items-center">
      <div>
        <h1 class="text-xl md:text-2xl font-bold">我的代課任務面板</h1>
        <p class="text-xs md:text-sm text-slate-400">BYOD 終端 - 支援 Local LLM 教案生成</p>
      </div>
      <div class="text-right">
        <div class="text-sm font-bold">Mr. Cheung Wai Kit</div>
        <div id="conn-status" class="text-xs text-amber-400 animate-pulse">● 連線中...</div>
      </div>
    </div>

    <!-- 任務列表區塊 -->
    <div class="p-6 space-y-4">
      
      <!-- 動態任務卡片 -->
      <div id="lesson-card" class="border-2 border-slate-200 rounded-xl p-5 bg-slate-50 relative overflow-hidden transition-all duration-300 hidden">
        
        <!-- 即時狀態標籤 -->
        <div id="status-badge" class="absolute top-0 right-0 px-4 py-1.5 rounded-bl-xl font-bold text-xs shadow-sm">
          載入中...
        </div>

        <div class="flex items-center gap-3 mb-4 mt-2">
          <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg font-mono font-bold text-sm">P.2 (09:15)</span>
          <h2 class="text-lg font-bold text-slate-800">2C - 創意科技</h2>
          <span class="text-sm text-slate-600 font-semibold px-2 py-0.5 rounded bg-slate-200">📍 Room 204</span>
        </div>

        <div class="text-sm text-slate-600 mb-4 border-b border-slate-200 pb-4">
          原任教師：<span class="font-bold text-slate-800">Ms. Wong (病假)</span>
        </div>

        <!-- AI 生成教案區塊 -->
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-5">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">Local LLM Generated</span>
            <span class="font-bold text-indigo-900 text-sm">AI 自動溫習教案 (根據最新教學進度)</span>
          </div>
          <div class="text-xs md:text-sm text-indigo-800 space-y-1.5">
            <p><strong>🎯 學習目標：</strong>Micro:bit 視角感應器複習 (防跟蹤書包前置知識)。</p>
            <p><strong>📝 課堂任務：</strong>引導學生完成 Google Classroom《任務工作紙 Unit 2》。</p>
            <p><strong>⚠️ SEN 提示：</strong>前排 2 位 SEN 學生容易焦慮，請允許他們分段完成任務。</p>
          </div>
        </div>

        <!-- 動態操作按鈕區 -->
        <div id="action-buttons" class="flex gap-3">
          <!-- 按鈕會由 JavaScript 動態生成 -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // ⚠️ 貼上你的 Firebase Config
    const firebaseConfig = {
      apiKey: "你的_API_KEY",
      authDomain: "你的_PROJECT_ID.firebaseapp.com",
      databaseURL: "你的_DATABASE_URL",
      projectId: "你的_PROJECT_ID",
      storageBucket: "你的_PROJECT_ID.appspot.com",
      messagingSenderId: "你的_SENDER_ID",
      appId: "你的_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const roomRef = db.ref('classrooms/rm204'); // 我們專注監聽 Room 204 的狀態

    const lessonCard = document.getElementById('lesson-card');
    const statusBadge = document.getElementById('status-badge');
    const actionButtons = document.getElementById('action-buttons');
    const connStatus = document.getElementById('conn-status');

    // 初始化假資料 (模擬校務處剛派發代課任務)
    function initMockData() {
      roomRef.set({
        status: "PENDING", // PENDING -> ACKNOWLEDGED -> ARRIVED
        className: "2C",
        subject: "創意科技",
        coverTeacher: "Mr. Cheung Wai Kit",
        originalTeacher: "Ms. Wong",
        period: "P.2"
      });
    }

    // 監聽 Firebase 資料庫變動 (雲端即時同步魔法)
    roomRef.on('value', (snapshot) => {
      const data = snapshot.val();
      
      if (!data) {
        initMockData(); // 如果資料庫是空的，先寫入預設資料
        return;
      }

      // 顯示卡片並更新連線狀態
      lessonCard.classList.remove('hidden');
      connStatus.className = 'text-xs text-emerald-400';
      connStatus.innerText = '● 雲端同步中';

      // 根據狀態渲染 UI
      if (data.status === 'PENDING') {
        lessonCard.className = 'border-2 border-amber-300 rounded-xl p-5 bg-amber-50 relative overflow-hidden transition-all duration-300';
        statusBadge.className = 'absolute top-0 right-0 px-4 py-1.5 rounded-bl-xl font-bold text-xs shadow-sm bg-amber-500 text-white animate-pulse';
        statusBadge.innerText = '待簽收 (Pending)';
        
        actionButtons.innerHTML = `
          <button onclick="updateStatus('ACKNOWLEDGED')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
            1. 無聲確認簽收 (Acknowledge)
          </button>
        `;
      } 
      else if (data.status === 'ACKNOWLEDGED') {
        lessonCard.className = 'border-2 border-sky-300 rounded-xl p-5 bg-sky-50 relative overflow-hidden transition-all duration-300';
        statusBadge.className = 'absolute top-0 right-0 px-4 py-1.5 rounded-bl-xl font-bold text-xs shadow-sm bg-sky-600 text-white';
        statusBadge.innerText = '已簽收 (Acknowledged)';
        
        actionButtons.innerHTML = `
          <button onclick="updateStatus('ARRIVED')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
            2. 已到達課室，打卡到班 (Sign-in)
          </button>
        `;
      }
      else if (data.status === 'ARRIVED') {
        lessonCard.className = 'border-2 border-emerald-400 rounded-xl p-5 bg-emerald-50/50 relative overflow-hidden transition-all duration-300';
        statusBadge.className = 'absolute top-0 right-0 px-4 py-1.5 rounded-bl-xl font-bold text-xs shadow-sm bg-emerald-600 text-white shadow-md';
        statusBadge.innerText = '✓ 上課中 (Arrived)';
        
        actionButtons.innerHTML = `
          <div class="flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-center border border-slate-300">
            打卡完成，安心上課
          </div>
          <button onclick="updateStatus('PENDING')" class="px-4 py-3 bg-slate-800 text-white text-xs rounded-xl hover:bg-slate-700">
            🔄 重設示範 (Reset Demo)
          </button>
        `;
      }
    });

    // 將狀態寫回 Firebase
    function updateStatus(newStatus) {
      roomRef.update({ status: newStatus });
    }
  </script>
</body>
</html>
